name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Windows target for type checking
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-gnu
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Check Windows API calls without linking
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build x64
        run: cargo build --release --locked
      - name: Package portable app
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MyOCR-Windows-portable-x64
          path: |
            windows/dist/portable/myocr.exe
            windows/dist/portable/README.md
            windows/dist/portable/THIRD_PARTY_NOTICES.md
            windows/dist/portable/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
